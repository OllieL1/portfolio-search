<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Retro sleeping owl: flat mid-century colours, closed eyes -->
  <!-- head: short angular ear tufts with a brow dip -->
  <path fill="#3b3d8f" d="M10 25 L9 7 L22 16 Q32 21 42 16 L55 7 L54 25 Q59 36 54 47 Q47 60 32 60 Q17 60 10 47 Q5 36 10 25 Z"/>
  <!-- facial discs -->
  <circle cx="21.5" cy="33" r="12.5" fill="#e6a537"/>
  <circle cx="42.5" cy="33" r="12.5" fill="#e6a537"/>
  <circle cx="21.5" cy="33" r="8" fill="#f5ead3"/>
  <circle cx="42.5" cy="33" r="8" fill="#f5ead3"/>
  <!-- closed eyes -->
  <path d="M16.5 33 Q21.5 37.5 26.5 33" fill="none" stroke="#3b3d8f" stroke-width="3" stroke-linecap="round"/>
  <path d="M37.5 33 Q42.5 37.5 47.5 33" fill="none" stroke="#3b3d8f" stroke-width="3" stroke-linecap="round"/>
  <!-- beak -->
  <path fill="#d65a2b" d="M32 38 L35.2 42.5 L32 48.5 L28.8 42.5 Z"/>
